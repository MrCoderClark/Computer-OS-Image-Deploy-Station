[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/engine",
    "crates/server",
    "crates/agent",
    "crates/admin",
]
exclude = [
    "crates/admin/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Shared across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Network / RPC
axum = "0.8"
tower = "0.5"
