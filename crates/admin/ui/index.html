<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeployStation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      background: #f3f3f3;
      color: #1a1a1a;
      display: flex;
      height: 100vh;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1c; color: #f5f5f5; }
      .sidebar { background: #2d2d2d; border-color: #404040; }
      .main { background: #1c1c1c; }
      .stat-card { background: #2d2d2d; border-color: #404040; }
    }
    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 1px solid #e5e5e5;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
    }
    .sidebar h2 {
      font-size: 14px;
      font-weight: 700;
      padding: 0 16px 16px;
    }
    .nav-item {
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      color: #5c5c5c;
    }
    .nav-item.active {
      background: #e8f4fd;
      color: #005fb8;
      font-weight: 600;
    }
    .nav-section {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8a8a8a;
      padding: 16px 16px 4px;
    }
    .main {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }
    .main h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .stat-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 16px;
    }
    .stat-card .label { font-size: 12px; color: #8a8a8a; }
    .stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
    .version {
      margin-top: auto;
      padding: 12px 16px;
      font-size: 11px;
      color: #8a8a8a;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>DeployStation</h2>
    <div class="nav-item active">Dashboard</div>
    <div class="nav-section">Library</div>
    <div class="nav-item">Image Catalogue</div>
    <div class="nav-item">Driver Packs</div>
    <div class="nav-item">Task Sequences</div>
    <div class="nav-section">Operations</div>
    <div class="nav-item">Build Media</div>
    <div class="nav-item">Deployments</div>
    <div class="nav-section">System</div>
    <div class="nav-item">Audit Log</div>
    <div class="nav-item">Settings</div>
    <div class="version" id="version">Loading...</div>
  </div>
  <div class="main">
    <h1>Dashboard</h1>
    <div class="stats">
      <div class="stat-card">
        <div class="label">Active Deployments</div>
        <div class="value">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Images in Catalogue</div>
        <div class="value">0</div>
      </div>
      <div class="stat-card">
        <div class="label">USB Media Built</div>
        <div class="value">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Mode</div>
        <div class="value" id="mode" style="font-size:16px">—</div>
      </div>
    </div>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;

    async function init() {
      try {
        const version = await invoke('get_version');
        document.getElementById('version').textContent = `v${version}`;
        const mode = await invoke('get_mode');
        document.getElementById('mode').textContent = mode;
      } catch (e) {
        console.error('Tauri invoke failed:', e);
      }
    }

    init();
  </script>
</body>
</html>
